name: Build Kernel SM-T285

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: 'cm-14.1'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi bison flex libssl-dev

      - name: Build Kernel
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabi-
          
          export KCFLAGS="-w"
          export HOSTCFLAGS="-w -fgnu89-inline"
          
          make gtexswifi-dt_defconfig
          make -j$(nproc) scripts
          make -j$(nproc)
          
      - name: Save Kernel Result
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: arch/arm/boot/zImage*
