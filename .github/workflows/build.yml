name: Build Kernel SM-T285

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: 'cm-14.1'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi

      - name: Fix Kernel Source
        run: |
          find . -type f \( -name "*.h" -o -name "*.c" \) -exec sed -i '/error "Unknown architecture specification"/d' {} +
          find . -name "Makefile" -exec sed -i 's/-Werror//g' {} +
          find . -name "*.mk" -exec sed -i 's/-Werror//g' {} +

      - name: Build Kernel
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabi-
          export KBUILD_BUILD_USER=builder
          export KBUILD_BUILD_HOST=github
          
          make gtexswifi-dt_defconfig
          make -j$(nproc) KCFLAGS="-w" HOSTCFLAGS="-w"

      - name: Save Kernel Result
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: arch/arm/boot/zImage*
