name: Build Kernel SM-T285

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: 'cm-14.1'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi

      - name: Build Kernel
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabi-
          
          # Fix "Unknown architecture specification"
          sed -i 's/#error "Unknown architecture specification"//g' include/soc/sprd/hardware.h
          
          make gtexswifi-dt_defconfig
          make -j$(nproc) KCFLAGS="-w" HOSTCFLAGS="-w" DISABLE_WERROR=1
          
      - name: Save Kernel Result
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: arch/arm/boot/zImage*
